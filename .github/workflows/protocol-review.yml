name: Daily upstream compatibility triage

on:
  schedule:
    - cron: '0 15 * * *' # 09:00 America/Mexico_City (UTC-6)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/protocol-review.yml'
      - 'tools/protocol_watch/**'
      - 'tools/native_ci/bootstrap.sh'
      - 'tools/native_ci/tests/bootstrap_test.sh'
      - 'tools/native_ci/pin.json'

  pull_request:
    paths:
      - '.github/workflows/protocol-review.yml'
      - 'tools/protocol_watch/**'
      - 'tools/native_ci/bootstrap.sh'
      - 'tools/native_ci/tests/bootstrap_test.sh'
      - 'tools/native_ci/pin.json'

permissions:
  contents: read

concurrency:
  group: public-protocol-review-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'writer' || github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install explicit bootstrap and linker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev libedit2 libxml2 libz3-4 jq
      - name: Verify offline bootstrap refusal controls
        run: tools/native_ci/tests/bootstrap_test.sh
      - name: Bootstrap immutable native compiler and dependencies
        run: |
          tools/native_ci/bootstrap.sh --work "$RUNNER_TEMP/protocol-toolchain"
          echo "OWA_ODIN_BIN=$RUNNER_TEMP/protocol-toolchain/sdk/odin" >> "$GITHUB_ENV"
          echo "OWA_SHARED_ROOT=$RUNNER_TEMP/protocol-toolchain/sdk/shared" >> "$GITHUB_ENV"
      - name: Offline protocol tooling tests
        run: tools/protocol_watch/run.sh test
      - name: Scan and assess bounded public upstream changes
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: scan
        run: >-
          tools/protocol_watch/run.sh ci
          --state-dir "$RUNNER_TEMP/protocol-state"
          --output-dir "$RUNNER_TEMP/protocol-report"
      - name: Track only new actionable tasks or investigation spikes
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          LINEAR_API: ${{ secrets.LINEAR_API }}
        run: >-
          tools/protocol_watch/run.sh linear
          --report "$RUNNER_TEMP/protocol-report/report.json"
          --output "$RUNNER_TEMP/protocol-report/linear-result.json"
          --run-url "https://github.com/dvrd/owa/actions/runs/$GITHUB_RUN_ID"
      - name: Retain public evidence
        if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-protocol-report
          path: |
            ${{ runner.temp }}/protocol-report/
            ${{ runner.temp }}/protocol-state/last_attempt.json
          retention-days: 30
          if-no-files-found: error
