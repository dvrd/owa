name: Daily upstream compatibility triage

on:
  schedule:
    - cron: '0 15 * * *' # 09:00 America/Mexico_City (UTC-6)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol-review.yml'
      - 'tools/protocol_watcher/linux-amd64.sha256'
      - 'tools/protocol_watcher/sources.json'

permissions:
  contents: read

concurrency:
  group: public-protocol-review
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - name: Download and verify the released protocol watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          watcher=tools/protocol_watcher
          if [[ ! -f "$watcher/linux-amd64.sha256" ]]; then watcher=tools/protocol_watch; fi
          pin=$watcher/linux-amd64.sha256
          read -r digest asset < "$pin"
          tag="protocol-watch-${digest:0:16}"
          source=$(sed -n 's/^# source //p' "$pin")
          if [[ -n "$source" ]]; then
            [[ "$source" =~ ^[0-9a-f]{40}$ ]]
            tag="protocol-watch-$source-${digest:0:16}"
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" == "$source" ]]
          fi
          echo "WATCHER_MANIFEST=$watcher/sources.json" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' "$digest" "$asset" | sha256sum --strict -c -)
          chmod +x "$RUNNER_TEMP/$asset"
      - name: Scan and assess bounded public upstream changes
        run: >-
          "$RUNNER_TEMP/protocol-watch-linux-amd64" ci
          --manifest "$WATCHER_MANIFEST"
          --state-dir "$RUNNER_TEMP/protocol-state"
          --output-dir "$RUNNER_TEMP/protocol-report"
      - name: Track only new actionable tasks or investigation spikes
        env:
          LINEAR_API: ${{ secrets.LINEAR_API }}
        run: >-
          "$RUNNER_TEMP/protocol-watch-linux-amd64" linear
          --report "$RUNNER_TEMP/protocol-report/report.json"
          --output "$RUNNER_TEMP/protocol-report/linear-result.json"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-protocol-report
          path: |
            ${{ runner.temp }}/protocol-report/
            ${{ runner.temp }}/protocol-state/last_attempt.json
          retention-days: 30
          if-no-files-found: error
