name: Daily public protocol review

on:
  schedule:
    - cron: '0 15 * * *' # 09:00 America/Mexico_City (UTC-6)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/protocol-review.yml'
      - 'tools/protocol_watch/**'

  pull_request:
    paths:
      - '.github/workflows/protocol-review.yml'
      - 'tools/protocol_watch/**'

permissions:
  contents: read

concurrency:
  group: public-protocol-review-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Offline protocol tooling tests
        run: python3 -m unittest discover -s tools/protocol_watch -p 'test_*.py' -v
      - name: Scan bounded public upstream metadata
        if: github.event_name != 'pull_request'
        id: scan
        run: >-
          python3 tools/protocol_watch/ci.py
          --state-dir "$RUNNER_TEMP/protocol-state"
          --output-dir "$RUNNER_TEMP/protocol-report"
      - name: Track human review in Webtools
        if: github.event_name != 'pull_request'
        env:
          LINEAR_API: ${{ secrets.LINEAR_API }}
        run: >-
          python3 tools/protocol_watch/linear_review.py
          --report "$RUNNER_TEMP/protocol-report/report.json"
          --output "$RUNNER_TEMP/protocol-report/linear-result.json"
          --run-url "https://github.com/dvrd/owa/actions/runs/$GITHUB_RUN_ID"
      - name: Retain public evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-protocol-report
          path: |
            ${{ runner.temp }}/protocol-report/
            ${{ runner.temp }}/protocol-state/last_attempt.json
          retention-days: 30
          if-no-files-found: error
