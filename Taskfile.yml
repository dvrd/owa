version: '3'

silent: true

vars:
  CI: '"{{.ODIN | default "odin"}}" run tools/ci "-out:{{.TMPDIR | default "/tmp"}}/owa-ci-{{(now).UnixNano}}" -vet -warnings-as-errors --'

tasks:
  check:
    desc: Run all Odin tests against the locked dependencies
    aliases: [default, test]
    cmds:
      - '{{.CI}} check {{.CLI_ARGS}}'

  check:local:
    desc: Test against explicitly selected or locally installed development dependencies
    cmds:
      - '{{.CI}} local {{.CLI_ARGS}}'

  check:locked:
    desc: Install frozen dependencies and verify the suites and private audio example
    cmds:
      - '{{.CI}} locked'

  hooks:install:
    desc: Enable the pre-push test hook for this clone
    cmds:
      - '{{.CI}} hooks'

  test:protocol:
    desc: Run protocol-watch tests with vet and allocation checks
    cmds:
      - '{{.CI}} protocol {{.CLI_ARGS}}'

  test:odin:
    desc: Stage the checkout and run Odin tests with optional package and compiler flags
    cmds:
      - '{{.CI}} test {{.CLI_ARGS}}'

  protocol:publish:
    desc: Build the Linux watcher, publish it to GitHub Releases and update its workflow checksum
    cmds:
      - '{{.CI}} publish'
