version: '3'

silent: true

tasks:
  check:
    desc: Run all local Odin tests with vet and allocation checks
    aliases: [default, test]
    cmds:
      - |
          for source_dir in src tools/protocol_watcher/src; do
            test_dir=tests/unit
            if [ "$source_dir" != src ]; then test_dir=tests/unit/protocol_watcher; fi
            for source in "$source_dir"/*.odin; do
              name=${source##*/}
              test -f "$test_dir/${name%.odin}_test.odin" || { echo "Missing unit tests for $source" >&2; exit 1; }
            done
            for unit in "$test_dir"/*_test.odin; do
              name=${unit##*/}
              test -f "$source_dir/${name%_test.odin}.odin" || { echo "Missing source for $unit" >&2; exit 1; }
            done
          done
      - task: test:odin
        vars:
          CLI_ARGS: '-vet -warnings-as-errors -define:ODIN_TEST_THREADS=1 -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true {{.CLI_ARGS}}'

  hooks:install:
    desc: Enable the pre-push test hook for this clone
    cmds:
      - git config --local core.hooksPath .githooks

  test:protocol:
    desc: Run protocol-watch tests with vet and allocation checks
    cmds:
      - |
          sh -s -- {{.CLI_ARGS}} <<'TASK_SCRIPT'
          set -eu
          umask 077
          work=$(mktemp -d "${TMPDIR:-/tmp}/owa-protocol-tests.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          for suite in tests/unit/protocol_watcher tests/e2e/protocol_watch; do
            "${OWA_ODIN_BIN:-${ODIN:-odin}}" test "$suite" \
              "-collection:shared=${OWA_SHARED_ROOT:-${WEBTOOLS_SHARED:-$HOME/dev/oss/Odin/shared}}" \
              -thread-count:1 -vet -warnings-as-errors -define:ODIN_TEST_THREADS=1 \
              -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true "-out:$work/tests" "$@"
          done
          TASK_SCRIPT

  test:odin:
    desc: Stage the checkout and run Odin tests with optional package and compiler flags
    cmds:
      - |
          bash -s -- {{.CLI_ARGS}} <<'TASK_SCRIPT'
          # Run the tests of a library in the src/ layout without modifying the checkout.
          # The library's own src/ provides its shared:<name> self-imports; every other
          # shared:<dependency> comes from the shared collection (the imported copies).
          set -euo pipefail
          root=$(pwd -P)
          compiler=${ODIN:-odin}
          dependency_source=${WEBTOOLS_SHARED:-$HOME/dev/oss/Odin/shared}
          selected=all
          internal_only=false
          while (($#)); do
              case "$1" in
                  --odin) compiler=$2; shift 2 ;;
                  --shared) dependency_source=$2; shift 2 ;;
                  --package) selected=$2; shift 2 ;;
                  --internal-only) internal_only=true; shift ;;
                  --) shift; break ;;
                  --help|-h) printf 'Usage: task test:odin -- [--odin PATH] [--shared DIR] [--package PATH] [--internal-only] [-- Odin flags]\n'; exit ;;
                  *) break ;;
              esac
          done
          for argument do
              case "$argument" in -collection:shared=*) dependency_source=${argument#-collection:shared=} ;; esac
          done
          [[ -d "$root/src" ]] || { printf 'No src/ in %s\n' "$root" >&2; exit 2; }
          [[ -d "$dependency_source" ]] || { printf 'No shared collection at %s\n' "$dependency_source" >&2; exit 2; }
          dependency_source=$(CDPATH='' cd -- "$dependency_source" && pwd -P)
          library=whatsapp
          compiler=$(command -v "$compiler" || printf '%s' "$compiler")
          compiler=$(CDPATH='' cd -- "$(dirname -- "$compiler")" && printf '%s/%s' "$PWD" "$(basename -- "$compiler")")
          work=$(mktemp -d "${TMPDIR:-/tmp}/odin-library-tests.XXXXXX")
          work=$(CDPATH='' cd -- "$work" && pwd -P)
          child='' timer=''
          cleanup() {
              trap - EXIT
              for pid in "$child" "$timer"; do
                  [[ -z "$pid" ]] || { kill -TERM -- "-$pid" 2>/dev/null || :; kill -KILL -- "-$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; }
              done
              rm -rf -- "$work"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' HUP TERM

          # Keep the old package selectors working as well as the directory names.
          case "$selected" in
              tools/protocol_watch) selected=tools/protocol_watcher ;;
              public_api|tests) selected=. ;;
              tools/protocol_watcher/tests) selected=tests/unit/protocol_watcher ;;
              encrypted_recovery|loopback_noise|recovery_campaign|version_http) selected=e2e/$selected ;;
          esac
          : > "$work/suites"
          for suite in tests/unit tests/unit/protocol_watcher "$root"/tests/e2e/*; do
              suite=${suite#"$root"/}
              compgen -G "$root/$suite/*_test.odin" >/dev/null || continue
              case "$suite" in
                  tests/unit) owner=. ;;
                  tests/unit/protocol_watcher) owner=tools/protocol_watcher ;;
                  *) owner=${suite#tests/} ;;
              esac
              [[ "$internal_only" == false || "$owner" == . ]] || continue
              [[ "$selected" == all || "$selected" == "$owner" || "$selected" == "$suite" ||
                 ( "$selected" == e2e && "$owner" == e2e/* ) ||
                 ( "$selected" == tools/protocol_watcher && "$owner" == e2e/protocol_watch ) ]] || continue
              printf '%s\n' "$suite" >> "$work/suites"
          done
          [[ -s "$work/suites" ]] || { printf 'No matching test suites\n' >&2; exit 2; }

          # copy_tree SOURCE TARGET: tracked and untracked unignored files of a Git
          # checkout, or every non-hidden file of a plain directory (an imported copy).
          copy_tree() {
              local source=$1 target=$2
              mkdir -p "$target"
              if [[ -e "$source/.git" ]]; then
                  while IFS= read -r -d '' path; do
                      [[ ! -f "$source/$path" ]] || printf '%s\0' "$path"
                  done < <(git -C "$source" ls-files --cached --others --exclude-standard -z) > "$work/files"
              else
                  (cd "$source" && find . -type d \( -name .git -o -name __pycache__ -o -name '.*' ! -name . \) -prune -o -type f ! -name '.*' -print0) > "$work/files"
              fi
              (cd "$source" && tar --null -T "$work/files" -cf -) | (cd "$target" && tar -xf -)
          }

          # Stage the repository with its geometry intact (src/ beside tests/), so paths
          # relative to tests/<package>/ resolve as they do in the checkout.
          repository=$work/repository
          copy_tree "$root" "$repository"
          shared=$work/shared
          mkdir -p "$shared"
          ln -s "$repository/src" "$shared/$library"

          # Dependencies: transitive closure of literal shared:<name> imports, taken from
          # the shared collection. The library itself always resolves to its own src/.
          imports_of() {
              { grep -rhoE '"shared:[A-Za-z0-9_]+' --include='*.odin' "$@" 2>/dev/null || :; } | sed 's/^"shared://' | sort -u
          }

          # normalize PATH: absolute path with . and .. segments removed lexically.
          normalize() {
              local IFS=/ part
              local -a out=()
              set -f
              for part in $1; do
                  case "$part" in
                      ''|.) ;;
                      ..) ((${#out[@]} == 0)) || unset 'out[${#out[@]}-1]' ;;
                      *) out+=("$part") ;;
                  esac
              done
              set +f
              printf '/%s' "${out[@]}"
              printf '\n'
          }

          # escaping_imports TREE [SCAN]: "file<TAB>resolved" for each relative import in
          # SCAN (default TREE) whose target lies outside TREE (old-layout libraries
          # import siblings as "../surf").
          escaping_imports() {
              local tree=$1 scan=${2:-$1} location file path resolved
              while IFS= read -r location; do
                  file=${location%%:*}
                  path=${location#*\"}
                  path=${path%\"}
                  resolved=$(normalize "$(dirname -- "$file")/$path")
                  [[ "$resolved" == "$tree" || "$resolved" == "$tree"/* ]] || printf '%s\t%s\n' "$file" "$resolved"
              done < <(grep -roE --include='*.odin' -H 'import( +[A-Za-z0-9_]+)? +"\.\.?/[^"]*"' "$scan" 2>/dev/null || :)
          }

          # The library's own sources must reach other libraries through shared:<name>.
          escapes=$(escaping_imports "$repository/src"; escaping_imports "$repository" "$repository/tests")
          if [[ -n "$escapes" ]]; then
              printf 'Relative imports leave the repository; use shared:<library> instead:\n%s\n' "${escapes//$repository\//}" >&2
              exit 2
          fi
          # The compiler's own packages may import shared:<name> too (core:net/quic
          # imports shared:async); those dependencies are staged as well.
          sdk=$("$compiler" root)
          sdk_imports=$({ grep -rhoE '"shared:[A-Za-z0-9_]+' --include='*.odin' --exclude='*_test.odin' --exclude-dir=tests "$sdk/core" "$sdk/vendor" 2>/dev/null || :; } | sed 's/^"shared://' | sort -u)
          pending="$(imports_of "$repository/src" "$repository/tests" "$repository/tools") $sdk_imports"
          seen=" $library "
          while [[ -n "$pending" ]]; do
              next=''
              for name in $pending; do
                  [[ "$seen" != *" $name "* ]] || continue
                  seen="$seen$name "
                  [[ -d "$dependency_source/$name" ]] || { printf 'Missing dependency shared:%s in %s\n' "$name" "$dependency_source" >&2; exit 2; }
                  copy_tree "$dependency_source/$name" "$shared/$name"
                  next="$next $(imports_of "$shared/$name")"
                  while IFS=$'\t' read -r _ resolved; do
                      [[ "$resolved" == "$shared"/* ]] || { printf 'shared:%s imports outside the collection: %s\n' "$name" "$resolved" >&2; exit 2; }
                      resolved=${resolved#"$shared"/}
                      next="$next ${resolved%%/*}"
                  done < <(escaping_imports "$shared/$name")
              done
              pending=$next
          done
          printf 'Library %s from %s/src; dependencies from %s:%s\n' "$library" "$root" "$dependency_source" "${seen# $library}"

          flags=("-collection:shared=$shared")
          has_output=false
          for argument do
              case "$argument" in
                  -collection:shared=*) ;;
                  -out:*) has_output=true; flags+=("$argument") ;;
                  *) flags+=("$argument") ;;
              esac
          done
          [[ "$has_output" == true ]] || flags+=("-out:$work/tests")

          set -m
          cd "$repository"
          while IFS= read -r relative; do
              target=$repository/$relative
              printf 'Testing %s\n' "$relative"
              "$compiler" test "$target" "${flags[@]}" </dev/null & child=$!
              (sleep 300; printf 'Test timeout: %s\n' "$relative" >&2; kill -TERM -- "-$child" 2>/dev/null || :; sleep 5; kill -KILL -- "-$child" 2>/dev/null || :) & timer=$!
              status=0
              wait "$child" || status=$?
              child=''
              kill -TERM -- "-$timer" 2>/dev/null || :
              wait "$timer" 2>/dev/null || :
              timer=''
              [[ "$status" == 0 ]] || exit "$status"
          done < "$work/suites"
          TASK_SCRIPT

  protocol:publish:
    desc: Build the Linux watcher, publish it to GitHub Releases and update its workflow checksum
    cmds:
      - |
          set -eu
          work=$(mktemp -d "${TMPDIR:-/tmp}/wa-protocol-release.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          asset=protocol-watch-linux-amd64
          repo=dvrd/owa
          source=$(git rev-parse --verify 'HEAD^{commit}')
          watcher=tools/protocol_watcher
          if [ -n "$(git status --porcelain --untracked-files=all -- "$watcher" ":(exclude)$watcher/linux-amd64.sha256")" ]; then
            echo 'Commit the protocol watcher inputs before publishing.' >&2
            exit 1
          fi
          mkdir "$work/source"
          git archive --output="$work/source.tar" "$source" -- "$watcher"
          tar -xf "$work/source.tar" -C "$work/source"
          compiler=${ODIN:-odin}
          shared=${WEBTOOLS_SHARED:-"$("$compiler" root)/shared"}
          "$compiler" build "$work/source/$watcher/src" "-collection:shared=$shared" \
            -target:linux_amd64 -microarch:generic -build-mode:obj -use-single-module -o:speed \
            -source-code-locations:filename -vet -warnings-as-errors "-out:$work/watch.o"
          zig cc -target x86_64-linux-gnu.2.35 "$work/watch.o" -s -o "$work/$asset"
          (cd "$work" && shasum -a 256 "$asset") > "$work/checksum"
          digest=$(cut -c1-16 "$work/checksum")
          tag=protocol-watch-$source-$digest
          # Push only the immutable source tag. This also makes a local source
          # commit available to GitHub without moving either development branch.
          remote=https://github.com/$repo.git
          git push "$remote" "$source:refs/tags/$tag"
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" "$work/$asset" --repo "$repo" --verify-tag --target "$source" --latest=false \
              --title "Protocol watcher $digest" \
              --notes "Built from $source. SHA-256: $(cut -d ' ' -f 1 "$work/checksum")."
          fi
          gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$work/download"
          (cd "$work/download" && shasum -a 256 -c "$work/checksum")
          # Keep the checksum line compatible with standard verification tools.
          printf '# source %s\n' "$source" >> "$work/checksum"
          cp "$work/checksum" "$watcher/linux-amd64.sha256"
